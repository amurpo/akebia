[package]
name = "akebia-frontend"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Desktop and terminal frontends for akebia-core"

[[bin]]
name = "akebia"
path = "src/main.rs"

[dependencies]
cpal = "0.18.1"
akebia-core.workspace = true
akebia-gba.workspace = true
# Without the default features, which pull in `wgpu`. To stretch a 160×144
# texture OpenGL is more than enough, and `glow` asks for less: fewer crates, a
# smaller binary and no Vulkan/DX12 on the machine that runs it. `x11` and
# `wayland` are both enabled because `winit` does negotiate client-side
# decorations, so —unlike `minifb`— the native Wayland backend works with a
# title bar.
eframe = { version = "0.35.0", default-features = false, features = [
    "glow",
    "default_fonts",
    "wayland",
    "x11",
] }

# Android reaches `winit`'s event loop through a different door: there is no
# `main`, only the `android_main` that `NativeActivity` calls, and this feature
# is what wires the two together. The alternative, `android-game-activity`, asks
# for an AndroidX AAR in exchange for a text input and a gamepad API that an
# emulator with eight buttons has no use for.
[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.35.0", default-features = false, features = ["android-native-activity"] }

[lints.rust]
unsafe_code = "forbid"
